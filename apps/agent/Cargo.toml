[package]
name = "orbit-agent"
version = "0.3.0"
edition = "2021"

[lib]
name = "orbit_agent"
path = "src/lib.rs"

[[bin]]
name = "orbit-agent"
path = "src/main.rs"

[dependencies]
bollard = "0.18"
futures-util = "0.3"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
http = "1"
libgit2-sys = "0.18"
libz-sys = { version = "1", default-features = false, features = ["libc", "static"] }
lz4_flex = "0.14"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
toml = "0.8"
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
