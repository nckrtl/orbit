version: 2

# One pull request a day bundles every update, so the self-hosted runners
# see one CI run instead of a burst of one run per package.
multi-ecosystem-groups:
  daily:
    schedule:
      interval: daily

updates:
  - package-ecosystem: composer
    directory: /apps/cli
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /apps/gateway
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /apps/e2e
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: composer
    directory: /packages/php-sdk
    patterns: ["*"]
    multi-ecosystem-group: daily
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: daily
