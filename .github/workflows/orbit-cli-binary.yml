name: Orbit CLI Binary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Full commit SHA to build.
        required: true
        type: string
      version:
        description: Version the binaries report, 0.N.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
            platform: linux
            architecture: x64
            artifact: orbit-linux-x64
            path: apps/cli/builds/dist/linux/linux-x64
          - target: linux-arm64
            runner: ubuntu-26.04-arm
            platform: linux
            architecture: arm
            artifact: orbit-linux-arm64
            path: apps/cli/builds/dist/linux/linux-arm
          - target: macos-arm64
            runner: macos-26
            platform: mac
            architecture: arm
            artifact: orbit-macos-arm64
            path: apps/cli/builds/dist/mac/mac-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, openssl, mbstring, tokenizer, ctype, filter, fileinfo, phar, zlib
          tools: composer:v2

      - name: Read build version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION:-$(bin/orbit-version)}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install CLI dependencies
        run: composer install --working-dir=apps/cli --no-interaction --prefer-dist --optimize-autoloader

      - name: Install isolated PHPacker
        run: composer install --working-dir=apps/cli/phpacker --no-interaction --prefer-dist

      - name: Build binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: bin/orbit-build-cli-binary "${{ matrix.platform }}" "${{ matrix.architecture }}" "$VERSION"

      - name: Run the binary on its own platform
        env:
          BINARY: ${{ matrix.path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          reported="$(env -i HOME="$home" PATH=/usr/bin:/bin "$BINARY" --version)"
          echo "$reported"
          test "$reported" = "Orbit ${VERSION}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
