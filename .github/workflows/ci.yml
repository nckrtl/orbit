name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            directory: apps/cli
          - name: Docs
            directory: apps/docs
          - name: Gateway
            directory: apps/gateway
          - name: E2E
            directory: apps/e2e
          - name: PHP SDK
            directory: packages/php-sdk

    env:
      ORBIT_TIA_DIRECTORY: .orbit-tia

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2
          ini-values: zend.exception_ignore_args=0

      - name: Set up Homebrew
        if: matrix.directory == 'apps/gateway'
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Install Gateway system dependencies
        if: matrix.directory == 'apps/gateway'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          id -u caddy >/dev/null 2>&1 || sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin caddy
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prepare application environment
        if: matrix.directory == 'apps/docs' || matrix.directory == 'apps/gateway' || matrix.directory == 'apps/e2e'
        run: cp .env.example .env

      - name: Install dependencies
        if: matrix.directory != 'apps/e2e'
        run: composer install --no-interaction --prefer-dist

      - name: Install all project dependencies for E2E integration tests
        if: matrix.directory == 'apps/e2e'
        working-directory: .
        run: bin/bootstrap --skip-checks

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Compute PHPStan result cache prefix
        id: orbit-phpstan-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-phpstan-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/phpstan.neon', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore PHPStan result cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-
            ${{ steps.orbit-phpstan-key.outputs.prefix }}-main-
            orbit-phpstan-php8.5-${{ matrix.directory }}-

      - name: Compute Pint and Rector cache prefix
        id: orbit-lint-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-lint-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/pint.json', matrix.directory), format('{0}/rector.php', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore Pint and Rector caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ matrix.directory }}/vendor/pint.cache
            ${{ matrix.directory }}/vendor/rector/cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-
            ${{ steps.orbit-lint-key.outputs.prefix }}-main-
            orbit-lint-php8.5-${{ matrix.directory }}-

      - name: Run project quality checks
        run: composer check

      - name: Save PHPStan result cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.directory }}/vendor/phpstan/cache/resultCache.php
          key: ${{ steps.orbit-phpstan-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Save Pint and Rector caches
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ matrix.directory }}/vendor/pint.cache
            ${{ matrix.directory }}/vendor/rector/cache
          key: ${{ steps.orbit-lint-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Compute Pest TIA cache prefix
        id: orbit-tia-key
        working-directory: .
        run: |
          printf 'prefix=%s\n' "orbit-tia-php8.5-${{ matrix.directory }}-${{ hashFiles(format('{0}/composer.lock', matrix.directory), format('{0}/tests/Pest.php', matrix.directory), format('{0}/phpunit.xml', matrix.directory), format('{0}/phpunit.xml.dist', matrix.directory)) }}" >> "$GITHUB_OUTPUT"

      - name: Restore Pest TIA graph
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.directory }}/.orbit-tia
          key: ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-
            ${{ steps.orbit-tia-key.outputs.prefix }}-main-
            orbit-tia-php8.5-${{ matrix.directory }}-

      - name: Run affected tests
        run: vendor/bin/pest --parallel --processes=4 --tia --compact

      - name: Save Pest TIA graph
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.directory }}/.orbit-tia
          key: ${{ steps.orbit-tia-key.outputs.prefix }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

  api-reference:
    name: API reference
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install Gateway and CLI dependencies
        run: |
          for project in apps/gateway apps/cli; do
            (cd "$project" && { [ -e .env ] || [ ! -f .env.example ] || cp .env.example .env; } && composer install --no-interaction --prefer-dist)
          done

      - name: Check that the API reference matches the Gateway routes
        run: bin/docs-openapi --check

      - name: Check that the MCP tool manifest matches the API reference
        run: bin/mcp-tools --check

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install annotation package dependencies
        working-directory: packages/agent-annotation
        run: bun install --frozen-lockfile

      - name: Check that the API types match the API reference
        run: bun run types && git diff --exit-code src/api/schema.d.ts

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  pi-server:
    name: Pi server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/pi-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  agent-annotation:
    name: Agent annotation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/agent-annotation

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

  agent:
    name: Rust agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: clippy,rustfmt
      - name: Install cross compiler
        run: cargo install cross --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build static x86_64 binary
        run: cross build --locked --release --target x86_64-unknown-linux-musl
      - name: Build static aarch64 binary
        run: cross build --locked --release --target aarch64-unknown-linux-musl

  required:
    name: Required checks
    if: always()
    needs: [project, api-reference, web, agent-annotation, pi-server, agent]
    runs-on: ubuntu-latest
    steps:
      - name: Require every project to pass
        env:
          PROJECT_RESULT: ${{ needs.project.result }}
          API_REFERENCE_RESULT: ${{ needs.api-reference.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ANNOTATION_RESULT: ${{ needs.agent-annotation.result }}
          PI_SERVER_RESULT: ${{ needs.pi-server.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
        run: test "$PROJECT_RESULT" = success && test "$API_REFERENCE_RESULT" = success && test "$WEB_RESULT" = success && test "$ANNOTATION_RESULT" = success && test "$PI_SERVER_RESULT" = success && test "$AGENT_RESULT" = success
