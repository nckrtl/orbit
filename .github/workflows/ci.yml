name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            directory: apps/cli
          - name: Docs
            directory: apps/docs
          - name: Gateway
            directory: apps/gateway
          - name: E2E
            directory: apps/e2e
          - name: PHP SDK
            directory: packages/php-sdk

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          ini-values: zend.exception_ignore_args=0

      - name: Set up Homebrew
        if: matrix.directory == 'apps/gateway'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Install Gateway system dependencies
        if: matrix.directory == 'apps/gateway'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes acl attr wireguard-tools
          brew install caddy openssl@3
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prepare application environment
        if: matrix.directory == 'apps/docs' || matrix.directory == 'apps/gateway' || matrix.directory == 'apps/e2e'
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Verify repository guidance
        run: composer guidance:check

      - name: Lint maintained documentation
        if: matrix.directory == 'apps/docs'
        run: composer docs:lint

      - name: Run full tests in parallel
        run: vendor/bin/pest --parallel --processes=2 --no-tia --compact

      - name: Check Rector
        run: vendor/bin/rector process --dry-run

      - name: Check formatting
        run: composer format:check

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse
